org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
systemProp.https.protocols=TLSv1.3,TLSv1.2

# Use the Google Play Services ML Kit barcode model instead of bundling native ML Kit .so files in the AAB.
# This avoids Play Console 16 KB page-size warnings for libbarhopper_v3.so / libimage_processing_util_jni.so.
dev.steenbakker.mobile_scanner.useUnbundled=true
