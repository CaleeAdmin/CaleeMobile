name: calee_mobile
description: "Mobile calendars, tasks, people, and display management for Calee."
publish_to: 'none'

version: 0.0.24+24

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.1
  # SHA-256 for privacy-safe, non-reversible reminder owner keys, schedule
  # fingerprints, and notification-identity digests. Already present transitively
  # (via flutter_test/others) at 3.0.7; pinned here as a direct dependency so the
  # reminder code can depend on it explicitly without upgrading unrelated packages.
  crypto: ^3.0.0
  flutter_secure_storage: ^9.2.4
  flutter_image_compress: ^2.4.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.11
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^3.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/calee_logo.png
