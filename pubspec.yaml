name: calee_mobile
description: "Mobile calendars, tasks, people, and display management for Calee."
publish_to: 'none'

version: 0.0.27+27

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.1
  # SHA-256 for privacy-safe, non-reversible reminder owner keys, schedule
  # fingerprints, and notification-identity digests. Already present transitively
  # (via flutter_test/others) at 3.0.7; pinned here as a direct dependency so the
  # reminder code can depend on it explicitly without upgrading unrelated packages.
  crypto: ^3.0.0
  flutter_secure_storage: ^9.2.4
  flutter_image_compress: ^2.4.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.11
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^3.0.0
  timezone: ^0.9.4
  # Already present transitively (via flutter_secure_storage/image_picker/others)
  # at 2.1.5; pinned here as a direct dependency so the attachment-download
  # cache-directory code can depend on it explicitly, matching the crypto
  # pattern above.
  path_provider: ^2.1.5
  # General document selection for attaching a non-photo file to a calendar
  # event (the project previously had no document picker, only image_picker).
  file_picker: ^11.0.3
  # Opening a downloaded attachment in the platform's default viewer.
  open_filex: ^4.7.0
  # Explicit "share" action for a downloaded attachment. Pinned to ^12.0.2
  # (not the latest 13.x) -- 13.x's win32 ^6.0.1 requirement conflicts with
  # file_picker's win32 ^5.9.0 requirement; pub's own suggested resolution.
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # Already present transitively via image_picker; pinned here as a direct
  # dev dependency so widget tests can swap ImagePickerPlatform.instance for
  # a fake (the plugin's own supported testing seam) instead of driving the
  # real platform channel.
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8

flutter:

  uses-material-design: true

  assets:
    - assets/calee_logo.png
    - assets/images/calee_home_white_tablet.jpg
