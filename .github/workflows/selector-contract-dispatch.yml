name: Trigger selector contract

# Cross-repository trigger (Workstream 1.4 / Priority 2): after a successful push
# to an integration branch (dev/stage/main), fire CaleeMobile-Regression's
# selector contract against THIS exact CaleeMobile commit, so a selector break is
# caught immediately rather than only on the daily schedule or the next
# CaleeMobile-Regression change.
#
# This does not touch the product build/test gate (flutter-ci.yml) at all.
#
# ENDPOINT / PERMISSION (Priority 2):
#   POST /repos/CaleeAdmin/CaleeMobile-Regression/actions/workflows/ci.yml/dispatches
#   body: {"ref":"main","inputs":{caleemobile_ref, expected_sha, expected_version, correlation_id}}
# This is the *workflow_dispatch* endpoint, which requires a token with
# **Actions: write** on CaleeMobile-Regression -- exactly the permission
# REGRESSION_DISPATCH_TOKEN is documented to carry. (The older
# `POST /repos/.../dispatches` repository_dispatch endpoint required
# **Contents: write**, which that token does NOT have -- that mismatch is the bug
# this workflow fixes. The receiver's ci.yml supports workflow_dispatch directly.)
#
# REQUIRED SECRET (not configured by this workflow -- see
# CaleeMobile-Regression/docs/CI_CROSS_REPO_TRIGGER.md): `REGRESSION_DISPATCH_TOKEN`,
# a fine-grained PAT (Actions: Read and write on CaleeAdmin/CaleeMobile-Regression)
# or a GitHub App installation token with the equivalent `actions:write`. When the
# secret is absent this workflow SKIPS cleanly (never a red X and never a
# fabricated success); the scheduled + manual runs in CaleeMobile-Regression are
# the documented fallback.
#
# BRANCH COVERAGE (Priority 2, requirement 4): for a push to a given branch to
# fire this trigger, THIS workflow file must EXIST on that branch. A workflow
# living only on `dev` cannot fire on a later independent push to `main` -- so
# this file must be merged to dev, stage AND main.
on:
  push:
    branches:
      - dev
      - stage
      - main

# The receiver workflow + ref to dispatch. Pinned to the receiver's default
# branch so the run uses main's ci.yml definition.
env:
  RECEIVER_REPO: CaleeAdmin/CaleeMobile-Regression
  RECEIVER_WORKFLOW: ci.yml
  RECEIVER_REF: main

jobs:
  dispatch-preflight:
    name: Check whether REGRESSION_DISPATCH_TOKEN is configured
    runs-on: ubuntu-latest
    # `secrets` cannot be referenced in a job-level `if:`; resolve the token's
    # presence in a step env and expose it as an output (same pattern
    # CaleeMobile-Regression uses for CALEEMOBILE_CHECKOUT_TOKEN).
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          TOKEN_SET: ${{ secrets.REGRESSION_DISPATCH_TOKEN != '' }}
        run: echo "has_token=$TOKEN_SET" >> "$GITHUB_OUTPUT"

  dispatch:
    name: Dispatch CaleeMobile-Regression selector contract (workflow_dispatch)
    needs: dispatch-preflight
    if: ${{ needs.dispatch-preflight.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pushed identity to verify
        id: identity
        run: |
          sha="${GITHUB_SHA}"
          version="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          # A unique correlation id ties the dispatched receiver run back to THIS
          # push, so its run ID can be captured below (workflow_dispatch returns
          # 204 with no run ID). The receiver echoes it into its run name.
          corr="cm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "correlation_id=$corr"
          } >> "$GITHUB_OUTPUT"
          echo "Dispatching selector contract for ${GITHUB_REF_NAME}@$sha (version $version, corr $corr)"

      - name: Fire workflow_dispatch to CaleeMobile-Regression
        env:
          TOKEN: ${{ secrets.REGRESSION_DISPATCH_TOKEN }}
          SHA: ${{ steps.identity.outputs.sha }}
          VERSION: ${{ steps.identity.outputs.version }}
          CORR: ${{ steps.identity.outputs.correlation_id }}
        run: |
          # Pin the regression run to THIS exact commit (caleemobile_ref=SHA) and
          # pass the expected SHA/version so the run FAILS if it somehow tests a
          # different build. A non-2xx response fails this job loudly.
          payload=$(jq -n \
            --arg ref "$RECEIVER_REF" \
            --arg cmref "$SHA" \
            --arg sha "$SHA" \
            --arg version "$VERSION" \
            --arg corr "$CORR" \
            '{ref:$ref, inputs:{caleemobile_ref:$cmref, expected_sha:$sha, expected_version:$version, correlation_id:$corr}}')
          http_code=$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${RECEIVER_REPO}/actions/workflows/${RECEIVER_WORKFLOW}/dispatches" \
            -d "$payload")
          echo "workflow_dispatch HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Dispatch failed:" >&2
            cat /tmp/dispatch_resp.txt >&2
            exit 1
          fi
          echo "Dispatched ci.yml to ${RECEIVER_REPO} (corr $CORR)."

      - name: Capture and report the dispatched run ID
        env:
          TOKEN: ${{ secrets.REGRESSION_DISPATCH_TOKEN }}
          CORR: ${{ steps.identity.outputs.correlation_id }}
          SHA: ${{ steps.identity.outputs.sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          # workflow_dispatch returns 204 with no run ID, so find the run the
          # receiver just created by matching the correlation id it echoes into
          # its run name (`[corr:<id>]`). Best-effort: a miss is reported, not
          # fatal (the dispatch itself already succeeded above).
          run_id=""; run_url=""
          for _ in $(seq 1 8); do
            sleep 5
            resp=$(curl -sS \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${RECEIVER_REPO}/actions/workflows/${RECEIVER_WORKFLOW}/runs?event=workflow_dispatch&per_page=30")
            run_id=$(echo "$resp" | jq -r --arg c "[corr:$CORR]" 'first(.workflow_runs[] | select((.name // "") | contains($c)) | .id) // empty')
            run_url=$(echo "$resp" | jq -r --arg c "[corr:$CORR]" 'first(.workflow_runs[] | select((.name // "") | contains($c)) | .html_url) // empty')
            if [ -n "$run_id" ]; then break; fi
          done
          {
            echo "### Cross-repo selector-contract dispatch"
            echo "- Endpoint: \`POST /repos/${RECEIVER_REPO}/actions/workflows/${RECEIVER_WORKFLOW}/dispatches\` (Actions: write)"
            echo "- CaleeMobile commit: \`$SHA\` (version \`$VERSION\`)"
            echo "- Correlation: \`$CORR\`"
            if [ -n "$run_id" ]; then
              echo "- Dispatched run ID: \`$run_id\`"
              echo "- Run: $run_url"
            else
              echo "- Dispatched run ID: not captured yet (the run may still be registering; see the receiver's Actions tab)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatched receiver run ID: ${run_id:-<not captured>}"
