name: Build Unsigned iOS Artifacts

# Note: This workflow builds an UNSIGNED IPA using --no-codesign.
# To produce a properly signed TestFlight / App Store IPA, the following
# secrets must be added and the codesign steps below must be enabled:
#   IOS_CERTIFICATE_BASE64        – base64-encoded .p12 distribution certificate
#   IOS_CERTIFICATE_PASSWORD      – password for the .p12 certificate
#   IOS_PROVISIONING_PROFILE_BASE64 – base64-encoded .mobileprovision profile
#   IOS_EXPORT_OPTIONS_PLIST_BASE64 – base64-encoded ExportOptions.plist

on:
  workflow_dispatch:

jobs:
  build-unsigned-ios:
    name: Generate calee-mobile unsigned iOS archive and IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run automation tests
        run: flutter test

      - name: Resolve release version from pubspec
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(scripts/derive_release_version.sh)

      - name: Build unsigned iOS archive with shared version metadata
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa --release --no-codesign \
            --build-name="${{ steps.build_meta.outputs.build_name }}" \
            --build-number="${{ steps.build_meta.outputs.build_number }}"

      - name: List generated iOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          find build/ios -maxdepth 8 -type f \( -name "*.xcarchive" -o -name "*.ipa" \) -print

      - name: Rename IPA with build name (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          src="build/ios/ipa/Runner.ipa"
          dst="build/ios/ipa/calee-mobile-unsigned-${{ steps.build_meta.outputs.sanitized_build_name }}.ipa"
          mv "$src" "$dst"
          echo "Renamed IPA to $dst"

      - name: Upload iOS IPA artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-ios-unsigned-ipa-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: build/ios/ipa/calee-mobile-unsigned-${{ steps.build_meta.outputs.sanitized_build_name }}.ipa
          if-no-files-found: error

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-ios-xcarchive-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
