name: Build Signed Android Artifacts

on:
  workflow_dispatch:

jobs:
  build-signed-android:
    name: Generate signed release APK and AAB
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: "0.0.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate signing secrets are configured
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Decode Android keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANDROID_KEYSTORE_BASE64" =~ [[:space:]] ]]; then
            echo "Keystore decode failed; re-create ANDROID_KEYSTORE_BASE64 as single-line base64" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "Keystore decode failed; decoded keystore file is missing or empty" >&2
            exit 1
          fi

          keystore_size_bytes="$(wc -c < "$keystore_path")"
          if (( keystore_size_bytes < 1024 )); then
            echo "Keystore decode failed; re-create ANDROID_KEYSTORE_BASE64 as single-line base64" >&2
            exit 1
          fi

          ls -lah "$keystore_path"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Verify Android keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore verification succeeded for alias '$ANDROID_KEY_ALIAS'."
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Derive build number from build name
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BUILD_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "BUILD_NAME must start with X.Y.Z; got '$BUILD_NAME'" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor >= 100 || patch >= 100 )); then
            echo "Invalid BUILD_NAME '$BUILD_NAME': require minor < 100 and patch < 100" >&2
            exit 1
          fi

          build_number=$(( major * 10000 + minor * 100 + patch ))

          sanitized_build_name="$(echo "$BUILD_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$sanitized_build_name" ]]; then
            echo "Sanitized build name is empty for BUILD_NAME '$BUILD_NAME'" >&2
            exit 1
          fi

          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "sanitized_build_name=$sanitized_build_name" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ steps.build_meta.outputs.build_number }}"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List generated APK files
        shell: bash
        run: |
          set -euo pipefail
          find build/app/outputs -maxdepth 5 -type f -name "*.apk" -print

      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ steps.build_meta.outputs.build_number }}"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List native debug symbols output
        shell: bash
        run: |
          set -euo pipefail
          find build/app/outputs -maxdepth 8 -type f -name "*native*debug*symbol*.zip" -print
          find build/app/intermediates -maxdepth 8 -type f -name "*.zip" | grep -E 'native[_-]debug[_-]symbol' || true

      - name: Resolve native debug symbols zip path
        id: native_symbols
        shell: bash
        run: |
          set -euo pipefail

          primary_path="build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [[ -f "$primary_path" ]]; then
            echo "zip_path=$primary_path" >> "$GITHUB_OUTPUT"
            echo "Resolved native symbols zip: $primary_path"
            exit 0
          fi

          fallback_path="$(find build/app/intermediates -maxdepth 8 -type f -path '*native_debug_symbol*' -name '*.zip' | head -n1 || true)"

          if [[ -z "$fallback_path" ]]; then
            echo "Native debug symbols zip not found in expected outputs" >&2
            exit 1
          fi

          echo "zip_path=$fallback_path" >> "$GITHUB_OUTPUT"
          echo "Resolved native symbols zip: $fallback_path"

      - name: Rename APK with build name
        shell: bash
        run: |
          set -euo pipefail
          src="build/app/outputs/flutter-apk/app-release.apk"
          dst="build/app/outputs/flutter-apk/caleesync-${{ steps.build_meta.outputs.sanitized_build_name }}.apk"
          mv "$src" "$dst"
          echo "Renamed APK to $dst"

      - name: Rename AAB with build name
        shell: bash
        run: |
          set -euo pipefail
          src="build/app/outputs/bundle/release/app-release.aab"
          dst="build/app/outputs/bundle/release/caleesync-${{ steps.build_meta.outputs.sanitized_build_name }}.aab"
          mv "$src" "$dst"
          echo "Renamed AAB to $dst"

      - name: Verify signed artifacts before upload
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/caleesync-${{ steps.build_meta.outputs.sanitized_build_name }}.apk"
          aab="build/app/outputs/bundle/release/caleesync-${{ steps.build_meta.outputs.sanitized_build_name }}.aab"

          latest_build_tools="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          apksigner_bin="$ANDROID_HOME/build-tools/$latest_build_tools/apksigner"

          if [[ ! -x "$apksigner_bin" ]]; then
            echo "apksigner was not found at $apksigner_bin" >&2
            exit 1
          fi

          "$apksigner_bin" verify --print-certs "$apk"
          # Android App Bundles are commonly signed with an upload key whose
          # certificate chain is not anchored in the runner trust store.
          # `-strict` upgrades that expected condition to a hard failure,
          # so we verify the AAB signature/cert details without strict mode.
          jarsigner -verify -certs "$aab"

          echo "Verified signed APK and AAB artifacts."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: build/app/outputs/flutter-apk/caleesync-${{ steps.build_meta.outputs.sanitized_build_name }}.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: build/app/outputs/bundle/release/caleesync-${{ steps.build_meta.outputs.sanitized_build_name }}.aab
          if-no-files-found: error

      - name: Upload native debug symbols zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          path: ${{ steps.native_symbols.outputs.zip_path }}
          if-no-files-found: error

      - name: Clean up signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
