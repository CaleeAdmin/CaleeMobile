name: Build Signed Android Artifacts

# Produces the signed APK/AAB that the Release Operator uploads to Google Play.
#
# This workflow does NOT upload to Google Play. Distribution is a deliberate
# manual step, so no CI run can publish a build. See docs/RELEASE_OPERATIONS.md
# for the release path and docs/RELEASE_CREDENTIALS.md for the signing secrets.

on:
  workflow_dispatch:

jobs:
  # First line of defence: prove the run targets an authorised release BRANCH.
  # workflow_dispatch can also target a TAG, and GITHUB_REF_NAME is the short
  # name for both — so a tag named `main` would otherwise look exactly like the
  # `main` branch. scripts/verify_release_ref.sh checks the fully-qualified ref
  # and the ref type, and has its own selftest. The preflight job below applies
  # the same rule through a separate implementation (`--allow-branch`), so a
  # mistake in one layer does not silently re-open the hole.
  release-ref-guard:
    name: Verify release ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the release ref is an authorised release branch
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify_release_ref.sh selftest
          scripts/verify_release_ref.sh check

  # Cheap gate: a missing signing secret, a version/identity inconsistency,
  # absent release notes or incomplete store-readiness evidence fails here in
  # under a minute, before the NDK install, the test suite and two release
  # builds are paid for.
  preflight:
    name: Release preflight (Android)
    needs: release-ref-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release preflight
        shell: bash
        run: |
          set -euo pipefail
          scripts/release_preflight.sh selftest
          scripts/generate_release_manifest.sh selftest
          scripts/verify_release_ref.sh selftest
          # BUILD readiness, not submission readiness. A signed candidate
          # must not be built from an unauthorised branch, without signing
          # secrets, or before the listing/privacy/review preparation is
          # done and a Release Operator is named. It must NOT require
          # physical-device qualification: the artifact being qualified is
          # what this run is about to produce. Submission readiness is
          # validated separately by the operator after qualification.
          scripts/release_preflight.sh check \
            --platform android \
            --require-secrets \
            --require-build-readiness \
            --allow-branch stage \
            --allow-branch main
        env:
          # Presence-only check. The preflight script reads whether these are
          # non-empty and reports only their NAMES; it never prints a value.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-signed-android:
    name: Generate calee-mobile signed release APK and AAB
    needs: [release-ref-guard, preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      # Gradle can auto-install the pinned NDK, but a corrupt SDK archive then
      # fails the whole signed release with no retry. Install it explicitly so
      # transient/corrupt NDK downloads are cleaned up and retried before the
      # release build starts.
      - name: Ensure pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail

          ndk_version="$(sed -nE 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          if [[ -z "$ndk_version" ]]; then
            echo "Could not resolve ndkVersion from android/app/build.gradle.kts" >&2
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not configured" >&2
            exit 1
          fi

          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$sdkmanager_bin" ]]; then
            echo "Android sdkmanager was not found" >&2
            exit 1
          fi

          ndk_dir="$sdk_root/ndk/$ndk_version"
          ndk_is_valid() {
            [[ -f "$ndk_dir/source.properties" && -x "$ndk_dir/ndk-build" ]]
          }

          if ndk_is_valid; then
            echo "NDK $ndk_version is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing NDK $ndk_version (attempt $attempt/3)..."

            # Remove any partial install and SDK-manager download cache left by
            # a previous failed/corrupt archive before retrying.
            rm -rf "$ndk_dir" "$sdk_root/.temp" "$HOME/.android/cache"

            if "$sdkmanager_bin" --sdk_root="$sdk_root" --install "ndk;$ndk_version"; then
              if ndk_is_valid; then
                echo "NDK $ndk_version installed and verified."
                exit 0
              fi
              echo "sdkmanager reported success but NDK validation failed." >&2
            else
              echo "NDK install attempt $attempt failed." >&2
            fi

            if (( attempt < 3 )); then
              sleep $((attempt * 15))
            fi
          done

          echo "Failed to install NDK $ndk_version after 3 attempts." >&2
          exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Run automation tests
        run: flutter test
        env:
          TZ: Australia/Perth

      - name: Validate signing secrets are configured
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Decode Android keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANDROID_KEYSTORE_BASE64" =~ [[:space:]] ]]; then
            echo "Keystore decode failed; re-create ANDROID_KEYSTORE_BASE64 as single-line base64" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "Keystore decode failed; decoded keystore file is missing or empty" >&2
            exit 1
          fi

          keystore_size_bytes="$(wc -c < "$keystore_path")"
          if (( keystore_size_bytes < 1024 )); then
            echo "Keystore decode failed; re-create ANDROID_KEYSTORE_BASE64 as single-line base64" >&2
            exit 1
          fi

          ls -lah "$keystore_path"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Verify Android keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore verification succeeded for alias '$ANDROID_KEY_ALIAS'."
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Resolve release version from pubspec
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(scripts/derive_release_version.sh)

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-name="${{ steps.build_meta.outputs.build_name }}" \
            --build-number="${{ steps.build_meta.outputs.build_number }}"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List generated APK files
        shell: bash
        run: |
          set -euo pipefail
          find build/app/outputs -maxdepth 5 -type f -name "*.apk" -print

      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-name="${{ steps.build_meta.outputs.build_name }}" \
            --build-number="${{ steps.build_meta.outputs.build_number }}"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List native debug symbols output
        shell: bash
        run: |
          set -euo pipefail
          find build/app/outputs -maxdepth 8 -type f -name "*native*debug*symbol*.zip" -print
          find build/app/intermediates -maxdepth 8 -type f -name "*.zip" | grep -E 'native[_-]debug[_-]symbol' || true

      - name: Resolve native debug symbols zip path
        id: native_symbols
        shell: bash
        run: |
          set -euo pipefail

          normalize_symbols_zip() {
            local source_zip="$1"
            local normalized_zip="build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip"

            mkdir -p "$(dirname "$normalized_zip")"

            local tmp_dir
            tmp_dir="$(mktemp -d)"
            unzip -q "$source_zip" -d "$tmp_dir"

            if [[ -d "$tmp_dir/lib" ]]; then
              (
                cd "$tmp_dir/lib"
                zip -qr "$GITHUB_WORKSPACE/$normalized_zip" .
              )
              echo "zip_path=$normalized_zip" >> "$GITHUB_OUTPUT"
              echo "Normalized native symbols zip by removing top-level lib/: $source_zip"
            else
              echo "zip_path=$source_zip" >> "$GITHUB_OUTPUT"
              echo "Native symbols zip already ABI-rooted: $source_zip"
            fi

            rm -rf "$tmp_dir"
          }

          primary_path="build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [[ -f "$primary_path" ]]; then
            normalize_symbols_zip "$primary_path"
            exit 0
          fi

          fallback_path="$({
            find build/app/outputs -maxdepth 10 -type f -name '*.zip'
            find build/app/intermediates -maxdepth 12 -type f -name '*.zip'
          } | grep -E 'native([_-])debug([_-])symbol' | head -n1 || true)"

          if [[ -n "$fallback_path" ]]; then
            normalize_symbols_zip "$fallback_path"
            exit 0
          fi

          generated_zip="build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          mkdir -p "$(dirname "$generated_zip")"

          symbols_dir="$({
            find build/app/intermediates -maxdepth 12 -type d -path '*native_debug_symbol*' -name out
            find build/app/intermediates -maxdepth 12 -type d -path '*native-debug-symbol*' -name out
            find build/app/intermediates -maxdepth 12 -type d -path '*unstripped_native_libs*' -name out
            find build/app/intermediates -maxdepth 12 -type d -path '*merged_native_libs*' -name out
          } | head -n1 || true)"

          if [[ -n "$symbols_dir" ]]; then
            if [[ -d "$symbols_dir/lib" ]]; then
              (
                cd "$symbols_dir/lib"
                zip -qr "$GITHUB_WORKSPACE/$generated_zip" .
              )
            else
              (
                cd "$symbols_dir"
                zip -qr "$GITHUB_WORKSPACE/$generated_zip" .
              )
            fi

            echo "zip_path=$generated_zip" >> "$GITHUB_OUTPUT"
            echo "Generated native symbols zip: $generated_zip from $symbols_dir"
            exit 0
          fi

          if [[ -z "$fallback_path" ]]; then
            echo "Native debug symbols zip not found in expected outputs" >&2
            exit 1
          fi

      - name: Rename APK with build name
        shell: bash
        run: |
          set -euo pipefail
          src="build/app/outputs/flutter-apk/app-release.apk"
          dst="build/app/outputs/flutter-apk/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.apk"
          mv "$src" "$dst"
          echo "Renamed APK to $dst"

      - name: Rename AAB with build name
        shell: bash
        run: |
          set -euo pipefail
          src="build/app/outputs/bundle/release/app-release.aab"
          dst="build/app/outputs/bundle/release/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.aab"
          mv "$src" "$dst"
          echo "Renamed AAB to $dst"

      - name: Verify signed artifacts before upload
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.apk"
          aab="build/app/outputs/bundle/release/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.aab"

          latest_build_tools="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          apksigner_bin="$ANDROID_HOME/build-tools/$latest_build_tools/apksigner"

          if [[ ! -x "$apksigner_bin" ]]; then
            echo "apksigner was not found at $apksigner_bin" >&2
            exit 1
          fi

          "$apksigner_bin" verify --print-certs "$apk"
          # Android App Bundles are commonly signed with an upload key whose
          # certificate chain is not anchored in the runner trust store.
          # `-strict` upgrades that expected condition to a hard failure,
          # so we verify the AAB signature/cert details without strict mode.
          jarsigner -verify -certs "$aab"

          echo "Verified signed APK and AAB artifacts."

      # bundletool is required to decode the AAB's compiled manifest for the
      # permission gate below. Pinned version + checksum verification live in
      # scripts/fetch_bundletool.sh; the cache only saves the re-download and
      # the jar is checksum-verified again on every run before use.
      - name: Cache bundletool
        uses: actions/cache@v4
        with:
          path: build/bundletool
          key: bundletool-1.18.1

      # Release-blocker gate: Google Play rejected Calee 0.0.29 for undeclared
      # broad media permissions merged in from a plugin manifest. Inspect the
      # final signed artifacts (the AAB is what Play receives) and fail BEFORE
      # any artifact is uploaded if a prohibited storage/media permission has
      # returned. The prohibited list lives only in
      # scripts/check_android_release_permissions.sh, shared with normal PR CI.
      - name: Inspect final release permissions
        shell: bash
        run: |
          set -euo pipefail
          BUNDLETOOL_JAR="$(scripts/fetch_bundletool.sh)"
          export BUNDLETOOL_JAR
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --apk "build/app/outputs/flutter-apk/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.apk" \
            --aab "build/app/outputs/bundle/release/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.aab"

      # Traceability: bind EVERY artifact this workflow uploads — not just the
      # store binary — to the source SHA, version, workflow run and its SHA-256,
      # so anything downloaded from this run can be proven to be what CI built.
      # The signing identity recorded here is the certificate's public
      # distinguished name and SHA-256 fingerprint, printed by apksigner; it is
      # public information, never key material.
      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.apk"
          aab="build/app/outputs/bundle/release/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.aab"
          native_symbols="${{ steps.native_symbols.outputs.zip_path }}"

          latest_build_tools="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          apksigner_bin="$ANDROID_HOME/build-tools/$latest_build_tools/apksigner"

          certs="$("$apksigner_bin" verify --print-certs "$apk")"
          signer_dn="$(sed -n 's/^Signer #1 certificate DN: //p' <<<"$certs" | head -n1)"
          signer_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$certs" | head -n1)"

          if [[ -z "$signer_dn" || -z "$signer_sha256" ]]; then
            echo "Could not read the signing certificate identity from apksigner output" >&2
            exit 1
          fi

          # Every --artifact/--artifact-dir below corresponds to an upload step
          # further down. The generator fails closed if any of them is missing,
          # so an uploaded-but-unrecorded artifact cannot slip through.
          scripts/generate_release_manifest.sh \
            --platform android \
            --build-name "${{ steps.build_meta.outputs.build_name }}" \
            --build-number "${{ steps.build_meta.outputs.build_number }}" \
            --artifact "app_bundle=$aab" \
            --artifact "apk=$apk" \
            --artifact "native_debug_symbols=$native_symbols" \
            --artifact-dir "dart_debug_symbols=build/symbols" \
            --signing-identity "$signer_dn (certificate SHA-256 $signer_sha256)" \
            --output "build/release-manifest-android.json"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-android-release-manifest-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: build/release-manifest-android.json
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-signed-apk-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: build/app/outputs/flutter-apk/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-signed-aab-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: build/app/outputs/bundle/release/calee-mobile-${{ steps.build_meta.outputs.sanitized_build_name }}.aab
          if-no-files-found: error

      - name: Upload native debug symbols zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-native-debug-symbols-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: ${{ steps.native_symbols.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload Dart obfuscation symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: calee-mobile-dart-symbols-${{ steps.build_meta.outputs.sanitized_build_name }}
          path: build/symbols
          if-no-files-found: error

      # The candidate exists; store submission does NOT. Spell out the exact
      # remaining sequence so a new operator cannot mistake a green run for
      # permission to publish.
      - name: Next steps for the Release Operator
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.build_meta.outputs.build_name }}+${{ steps.build_meta.outputs.build_number }}"

          echo "::notice::Signed Android candidate $version produced. Store submission is still BLOCKED until submission-readiness validation passes."

          cat <<EOF
          ============================================================
          Signed candidate produced successfully.

          This is NOT store readiness, and this run has NOT published
          anything. Only build readiness was validated before the build.

          Remaining sequence for the Release Operator:

            1. Download the AAB and the release manifest from this run.
            2. Upload the AAB to Google Play INTERNAL TESTING.
            3. Install it from the internal track on a physical Android
               device and qualify it. Record it against build number
               $version.
            4. Complete the submission_readiness section of
               docs/release_evidence/${{ steps.build_meta.outputs.build_name }}.json
               (device, OS version, build_number, outcome, final listing and
               screenshot review against this candidate, Release Approver).
            5. Verify it:

                 scripts/release_preflight.sh check \\
                   --platform android \\
                   --require-store-readiness

            6. Only once that passes: promote to Production at a 10% staged
               rollout (docs/RELEASE_OPERATIONS.md section 6).
          ============================================================
          EOF

      - name: Clean up signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
