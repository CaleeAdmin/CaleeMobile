name: Android Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build"
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      FLUTTER_CHANNEL: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve project version from pubspec
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(awk -F': ' '/^version:/{print $2; exit}' pubspec.yaml)"
          app_version="${raw_version%%+*}"
          if [[ -z "$app_version" ]]; then
            echo "Unable to determine app version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Validate formatting
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Ensure Android release signing secrets exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${{ secrets[secret_name] }}" ]]; then
              echo "Missing required secret: $secret_name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Decode Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Unable to locate apksigner in Android SDK build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$RELEASE_APK"

      - name: Package APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p build-artifacts

          DEBUG_SRC="build/app/outputs/flutter-apk/app-debug.apk"
          RELEASE_SRC="build/app/outputs/flutter-apk/app-release.apk"

          DEBUG_DEST="build-artifacts/caleesync-${VERSION}-debug.apk"
          RELEASE_DEST="build-artifacts/caleesync-${VERSION}-release.apk"

          cp "$DEBUG_SRC" "$DEBUG_DEST"
          cp "$RELEASE_SRC" "$RELEASE_DEST"

          sha256sum "$DEBUG_DEST" > "${DEBUG_DEST}.sha256"
          sha256sum "$RELEASE_DEST" > "${RELEASE_DEST}.sha256"

          if [[ -d build/test-results ]]; then
            cp -r build/test-results build-artifacts/test-results
          fi
          if [[ -d build/reports ]]; then
            cp -r build/reports build-artifacts/reports
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caleesync-android-${{ steps.app_version.outputs.version }}
          path: build-artifacts/
          if-no-files-found: error

      - name: Publish GitHub release assets for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/caleesync-${{ steps.app_version.outputs.version }}-release.apk
            build-artifacts/caleesync-${{ steps.app_version.outputs.version }}-release.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
