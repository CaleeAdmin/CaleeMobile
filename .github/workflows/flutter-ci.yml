name: Flutter CI

# Runs the required format/analyze/test gate for every change headed for an
# integration branch. `dev` is the day-to-day integration branch, so every
# normal CaleeMobile pull request (which targets `dev`) now receives this same
# check; `stage` and `main` keep it for the promotion path.
#
# Branch-protection note for administrators: the required status checks to
# enforce on `dev` (and `stage`/`main`) are the two job names below,
#   "Format, Analyze & Test"
#   "Android debug build"
# reported under this "Flutter CI" workflow. Add both under
# Settings -> Branches -> Branch protection rules -> Require status checks to
# pass before merging, for each of `dev`, `stage`, and `main`, so no pull
# request can merge into an integration branch without a green run of each.
#
# Release-build scope: the release-APK build/sign/notification-config steps
# near the bottom of the "Format, Analyze & Test" job are gated to only
# execute on a push to `stage` or `main` (i.e. a merge/promotion into those
# branches) or a manual workflow_dispatch targeting one of them — never on a
# `dev` push or on any pull_request, including PRs targeting stage/main. See
# the `if:` conditions on those individual steps for the exact rule.
#
# Job scope: "Format, Analyze & Test" runs on every trigger. "Android debug
# build" runs on pull_request only, and only after the checks job passes. It
# is the pre-merge platform-build gate — a change that passes
# format/analyze/test but breaks the Android build is caught before merge —
# so re-running it on the stage/main push that merges that same tree bought
# nothing but billed 13 minutes a promotion. The Android release path is
# still exercised on stage/main by the gated release-APK steps in the checks
# job, and build-signed-apk.yml independently re-checks both the APK and the
# AAB before any artifact can reach a store.
on:
  pull_request:
    branches:
      - dev
      - stage
      - main
  # Pull requests already validate every change headed for dev. Do not repeat
  # the full gate after the same change merges there. Push runs remain on the
  # release branches because they execute the gated release smoke checks below.
  push:
    branches:
      - stage
      - main
  # Allow the gate to be started on demand from the Actions tab (any branch).
  workflow_dispatch:

# A new commit on an open PR makes its older in-flight run obsolete. Keep every
# stage/main push and manual run, because release verification must complete.
concurrency:
  group: flutter-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    # Runs 31240263655 (attempt 3) hung in "Build Android App Bundle (release)"
    # for 48 minutes before the job was terminated — against a ~19 minute norm
    # for this job on a stage/main push. Without an explicit cap a wedged Gradle
    # build bills against the six-hour default. 35 leaves headroom over the
    # measured worst-case release build while still failing fast on a hang.
    timeout-minutes: 35

    steps:
      # Free runner disk space before the toolchain and builds. Runs 429/430
      # (the first to include the release smoke build) failed with "No space
      # left on device" in :app:mergeReleaseNativeDebugMetadata — the default
      # ubuntu-latest image leaves ~14 GB free, which the debug + R8 release
      # builds together exhaust. Removing preinstalled toolchains this job
      # never uses (.NET, Haskell, CodeQL, Boost, Swift) frees ~15 GB. The
      # Android SDK and JDK are NOT touched.
      - name: Free runner disk space
        run: |
          echo "Free space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift
          echo "Free space after cleanup:"
          df -h /

      - uses: actions/checkout@v4

      # JDK 17 for the Android Gradle build below. The GitHub-hosted Android SDK
      # (preinstalled on ubuntu-latest) is used as-is; no SDK download, no
      # signing config, and no secrets are introduced.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Guard the native Android/iOS notification configuration (scheduled-
      # notification receivers, reboot permission, notification delegate,
      # dedicated icon, release shrinking config). Runs before the Flutter build
      # so a platform-config regression fails fast. Standard-library Python only.
      - name: Check notification platform config
        run: |
          python3 .github/scripts/check_notification_platform_config.py selftest
          python3 .github/scripts/check_notification_platform_config.py check

      # Keep the release tooling honest on every change: the selftests prove the
      # release gates still fail for a broken configuration, and the
      # repository-only checks catch app-identity/version-drift regressions (a
      # hardcoded versionName, a changed bundle id, missing release notes) at PR
      # time rather than when a release is being cut.
      #
      # This is the REPOSITORY CORRECTNESS level only. It deliberately does not
      # pass --require-secrets or --require-store-readiness: normal CI has no
      # signing secrets, and a green PR is not release approval or store
      # readiness. The signed release workflows apply those levels.
      - name: Release preflight (repository checks)
        run: |
          scripts/release_preflight.sh selftest
          scripts/generate_release_manifest.sh selftest
          scripts/verify_release_ref.sh selftest
          scripts/read_apk_signing_identity.sh selftest
          scripts/release_preflight.sh check

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      # The cross-repository event occurrence identity contract suite
      # (CaleeAdmin/calee-hub-core#421) runs inside the ordinary `flutter test`
      # gate below, like every other suite. The two focused invocations first
      # add the only two things a single run cannot prove:
      #
      #  * that the suite really EXECUTED. It prints a deterministic marker only
      #    after every contract assertion has run, so a rename, a skip, a
      #    deleted file or a missing fixture leaves the marker absent and this
      #    step fails — rather than the gate quietly going green on nothing.
      #  * that canonical identities are INDEPENDENT OF THE DEVICE TIMEZONE.
      #    That is the whole point of failing closed on a floating source. The
      #    display parser reads the PROCESS timezone, which a running VM cannot
      #    change, so proving it needs the process to actually start elsewhere.
      #    America/New_York is in the list because Australia/Perth, UTC and
      #    Pacific/Kiritimati all have non-negative UTC offsets, and an all-day
      #    date that drifted a day would only drift west of UTC.
      #
      # The marker carries the ambient zone, and the grep below requires the
      # zone it asked for: a TZ= override that stopped reaching the test process
      # would otherwise run the same thing twice and still look green.
      #
      # One test file, so each invocation costs seconds. No new job, no new
      # workflow, and the full-suite run below is unchanged.
      - name: Test
        run: |
          set -euo pipefail
          for zone in UTC Pacific/Kiritimati America/New_York; do
            echo "== event occurrence identity contract under TZ=$zone =="
            TZ="$zone" flutter test --reporter expanded \
              test/features/local_subscriber/event_occurrence_identity_contract_test.dart \
              | tee "${RUNNER_TEMP:-/tmp}/contract-suite.log"
            grep -q "event occurrence identity contract tests passed" \
              "${RUNNER_TEMP:-/tmp}/contract-suite.log"
            grep -q "ambient TZ=$zone" "${RUNNER_TEMP:-/tmp}/contract-suite.log"
          done
          flutter test
        env:
          TZ: Australia/Perth

      # The release APK build below was the single most expensive step in CI
      # (12m48s on run 31560260193) and this was the only job running Gradle
      # without a dependency cache. Restored only when the release build below
      # actually runs, so a pull_request run — where every Gradle step is
      # skipped — never saves a near-empty cache under the shared key and
      # poisons it for the Android job.
      #
      # Because this arm only runs on stage/main, the entry it writes is scoped
      # to a release branch, which is what makes it restorable from every other
      # branch: GitHub scopes a cache to the branch that wrote it plus that
      # branch's descendants, so a cache written by a feature branch is
      # unreadable by any other feature branch. Cache-only: never affects build
      # output or signing.
      - name: Cache Gradle
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        uses: actions/cache@v4
        with:
          # Only the downloaded dependency jars and the wrapper distribution.
          # Caching all of ~/.gradle/caches produced multi-gigabyte entries that
          # evicted each other against the repository's 10 GB cache budget —
          # run 31294142412 restored nothing in 1s and then paid 10m50s for a
          # build that takes 3m49s warm.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # Ephemeral CI-only signing key so the release smoke build below can
      # produce a signed APK without touching production signing secrets.
      # Generated fresh in $RUNNER_TEMP (job-scoped, never cached, never
      # uploaded as an artifact, and unrelated to android/key.properties or
      # any repository/organization secret).
      #
      # Gated to stage/main merges (push) or a manual dispatch targeting one
      # of them — not run on dev pushes or any pull_request — per the
      # release-build-scope note at the top of this file.
      - name: Generate temporary CI keystore
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calee-ci-release.jks" \
            -storepass "ci-temporary-password" \
            -keypass "ci-temporary-password" \
            -alias "calee-ci" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Calee CI, OU=CI, O=Calee, L=Perth, ST=WA, C=AU"

      # Smoke-verify that the isMinifyEnabled/isShrinkResources release config
      # still produces a working, correctly packaged release build (R8 +
      # resource shrinking exercise real code paths a debug build does not).
      # Signed with the ephemeral keystore above; this APK is a smoke-test
      # product only — never uploaded, never published.
      #
      # Gated to stage/main merges (push) or a manual dispatch targeting one
      # of them — see the release-build-scope note at the top of this file.
      - name: Build Android APK (release)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calee-ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-temporary-password
          ANDROID_KEY_ALIAS: calee-ci
          ANDROID_KEY_PASSWORD: ci-temporary-password

      # Inspect the packaged release artifact itself — manifest permissions,
      # the scheduled-notification receivers, and the notification icon must
      # all survive R8 + resource shrinking. The source-level config check
      # above can't catch a shrinker regression; this reads the built APK.
      # Standard-library Python only; never modifies the APK.
      #
      # Gated identically to the release build above (it inspects that
      # build's output, so it must skip whenever that step skips) — see the
      # release-build-scope note at the top of this file.
      - name: Inspect release APK notification configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          python3 .github/scripts/check_notification_release_apk.py selftest
          python3 .github/scripts/check_notification_release_apk.py check \
            build/app/outputs/flutter-apk/app-release.apk

      # Same gating as the release smoke build above: verify the packaged
      # release APK carries no broad storage/media permission (the Google
      # Play 0.0.29 release blocker). Shares the single prohibited-permission
      # policy in scripts/check_android_release_permissions.sh with the PR
      # AAB gate below and the signed-build workflow.
      - name: Inspect release APK permissions
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --apk build/app/outputs/flutter-apk/app-release.apk

  # Required, non-publishing platform-build gate: compiles the Android app so
  # a change that builds green in analyze/test but breaks the platform build
  # (a manifest-merge conflict, a plugin's minSdk requirement, a Gradle/Kotlin
  # incompatibility) is caught on every PR, not only at stage/main promotion.
  # No repository or organization signing secret is used, and it produces no
  # artifact that is uploaded, published, or deployed anywhere.
  #
  # NOTE FOR ADMINISTRATORS: the job name below, "Android debug build", is a
  # required status check on dev/stage/main. It is deliberately unchanged even
  # though the job no longer builds a debug APK (see the release-AAB note
  # further down) — renaming it would make branch protection wait forever on a
  # check name that no longer reports. Rename it only together with the branch
  # protection settings.
  android-debug-build:
    name: Android debug build
    runs-on: ubuntu-latest
    # Only pull requests. On a push to stage/main this job re-built the exact
    # tree the pull request had already built minutes earlier — 13 billable
    # minutes of pure repetition per promotion. The release-build arm of
    # analyze-and-test still exercises the Android release path on stage/main,
    # and build-signed-apk.yml re-checks both the APK and the AAB before
    # anything can reach a store.
    if: github.event_name == 'pull_request'
    # Serialised behind the cheap checks. Both jobs used to start together, so
    # a run that had already failed kept paying for a full Android build: on
    # run 31294142412 the checks failed after 1m05s and this job billed another
    # 18 minutes before finishing green. The trade is pull-request latency
    # (the two jobs no longer overlap), not billable minutes — a passing run
    # costs the same as before, a failing one stops at the checks.
    needs: analyze-and-test
    # ~12 minutes is the warm-cache norm and ~19 the cold-cache worst case
    # (run 31294142412). See the timeout note on analyze-and-test above.
    timeout-minutes: 25

    steps:
      # Same rationale as the equivalent step in analyze-and-test above: the
      # default ubuntu-latest image doesn't reliably leave enough free space
      # for a Gradle + Android build alongside preinstalled toolchains this
      # job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      # Bounds build duration on repeat runs (a cold Gradle/AGP/Kotlin +
      # dependency resolution is the dominant cost of this job). Cache-only:
      # never affects build output or signing.
      #
      # Scoped to the dependency jars and the wrapper rather than all of
      # ~/.gradle/caches: the old path produced multi-gigabyte entries that
      # evicted each other against the repository's 10 GB cache budget, so
      # restore-keys regularly found nothing (run 31294142412 restored nothing
      # in 1s and paid 10m50s for a build that takes 3m49s warm, then spent a
      # further 1m22s saving the oversized entry). Key renamed alongside the
      # narrowed path so the first run cannot restore a stale wide entry.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      # --- Platform build + broad-media-permission gate (every PR) ----------
      # The release App Bundle below is now the only Android build in this job.
      # It previously ran after a `flutter build apk --debug`, which cost a
      # further 3m49s warm (10m50s cold, run 31294142412) and proved a strict
      # subset of what this build proves: the AAB compiles the same Gradle,
      # AGP, Kotlin and plugin graph, merges the same library manifests, and
      # additionally exercises R8 and resource shrinking. The one thing it no
      # longer covers is a fault unique to the debug manifest or the debug
      # signing config — accepted deliberately, because such a fault cannot
      # reach a store artifact.
      #
      # Google Play rejected the 0.0.29 AAB because a plugin's library
      # manifest merged READ_MEDIA_IMAGES/READ_MEDIA_VIDEO (and friends) into
      # the release artifact. The app manifest now strips them with
      # tools:node="remove"; the steps below build the actual release AAB —
      # the artifact type Google Play receives — and fail the PR if any
      # prohibited permission ever merges back in (e.g. via a dependency
      # bump). Policy list lives in
      # scripts/check_android_release_permissions.sh, shared with the
      # signed-build workflow so the two gates can never drift apart.

      # Release Gradle builds hard-require signing inputs, so use the same
      # ephemeral CI-only keystore pattern as the stage/main release smoke
      # build in the job above: generated fresh in $RUNNER_TEMP, never cached,
      # never uploaded, unrelated to any production signing secret.
      - name: Generate temporary CI keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calee-ci-release.jks" \
            -storepass "ci-temporary-password" \
            -keypass "ci-temporary-password" \
            -alias "calee-ci" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Calee CI, OU=CI, O=Calee, L=Perth, ST=WA, C=AU"

      # This AAB is a permission-inspection product only — never uploaded as
      # an artifact, never published.
      - name: Build Android App Bundle (release)
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calee-ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-temporary-password
          ANDROID_KEY_ALIAS: calee-ci
          ANDROID_KEY_PASSWORD: ci-temporary-password

      # bundletool decodes the AAB's compiled manifest for the check below.
      # Pinned version + checksum verification live in
      # scripts/fetch_bundletool.sh; the cache only saves the re-download and
      # the jar is checksum-verified again on every run before use.
      - name: Cache bundletool
        uses: actions/cache@v4
        with:
          path: build/bundletool
          key: bundletool-1.18.1

      - name: Inspect release AAB permissions
        run: |
          BUNDLETOOL_JAR="$(scripts/fetch_bundletool.sh)"
          export BUNDLETOOL_JAR
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --aab build/app/outputs/bundle/release/app-release.aab
