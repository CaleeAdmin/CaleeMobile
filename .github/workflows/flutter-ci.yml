name: Flutter CI

# Runs the required format/analyze/test gate for every change headed for an
# integration branch. `dev` is the day-to-day integration branch, so every
# normal CaleeMobile pull request (which targets `dev`) now receives this same
# check; `stage` and `main` keep it for the promotion path.
#
# Branch-protection note for administrators: the required status checks to
# enforce on `dev` (and `stage`/`main`) are the two job names below,
#   "Format, Analyze & Test"
#   "Android debug build"
# reported under this "Flutter CI" workflow. Add both under
# Settings -> Branches -> Branch protection rules -> Require status checks to
# pass before merging, for each of `dev`, `stage`, and `main`, so no pull
# request can merge into an integration branch without a green run of each.
#
# TIERED EXECUTION POLICY (CI-cost optimisation, 2026-08):
#
#   1. Development/hotfix PR (any head branch except the standard promotions
#      below, targeting dev, stage or main): format/analyze/test + the debug
#      Android build always run. The release-AAB permission build in the
#      "Android debug build" job additionally runs ONLY when the change
#      touches permission/native/dependency-sensitive inputs (android/**,
#      pubspec.yaml, pubspec.lock, the permission/bundletool scripts, or this
#      workflow itself) — a Dart-only change cannot alter the packaged
#      manifest, so rebuilding the release bundle for it proves nothing new.
#
#   2. Standard promotion PR (head `dev` -> base `stage`, or head `stage` ->
#      base `main`): both heavy jobs are SKIPPED. Every commit being promoted
#      already passed full PR CI into dev (and a stage push run for
#      stage->main), and the destination-branch push run below immediately
#      re-verifies the release build on the exact merged commit. Skipped
#      required checks are reported with conclusion "skipped", which GitHub
#      branch protection treats as satisfying a required status check, so
#      promotion PRs are never left permanently pending. A PR from any OTHER
#      head branch into stage/main (a direct hotfix) is NOT a promotion and
#      receives full tier-1 CI.
#
#   3. Push to stage/main: release verification (release APK smoke +
#      notification/permission inspection in "Format, Analyze & Test", and
#      the release-AAB permission build in "Android debug build") runs; the
#      debug APK build is skipped — a debug artifact adds no information once
#      the release build itself is verified on the same commit.
#
# The "change-scope" job below computes the promotion/sensitivity facts from
# the PR base/head refs and a base-SHA-anchored git diff (no untrusted PR
# data is ever shell-expanded; refs/SHAs are passed via env). Job and check
# names are deliberately unchanged from the pre-tiered workflow.
#
# Release-build scope: the release-verification steps run as before. The
# release-APK build/sign/notification-config steps near the bottom of the
# "Format, Analyze & Test" job are gated to only execute on a push to `stage`
# or `main` (i.e. a merge/promotion into those branches) or a manual
# workflow_dispatch targeting one of them — never on a `dev` push or on any
# pull_request, including PRs targeting stage/main. See the `if:` conditions
# on those individual steps for the exact rule. The debug Android build in
# the separate job below runs on every development/hotfix pull request (all
# PRs except the standard dev->stage / stage->main promotions — see the
# tiered policy above), so a platform build broken by a change that still
# passes format/analyze/test is caught before merge, not only at stage/main
# promotion.
on:
  pull_request:
    branches:
      - dev
      - stage
      - main
  # Pull requests already validate every change headed for dev. Do not repeat
  # the full gate after the same change merges there. Push runs remain on the
  # release branches because they execute the gated release smoke checks below.
  push:
    branches:
      - stage
      - main
  # Allow the gate to be started on demand from the Actions tab (any branch).
  workflow_dispatch:

# A new commit on an open PR makes its older in-flight run obsolete. Keep every
# stage/main push and manual run, because release verification must complete.
concurrency:
  group: flutter-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computes the two facts the tiered policy (header comment) needs:
  #   promotion — is this PR the standard dev->stage or stage->main promotion?
  #   sensitive — did the change touch permission/native/dependency-sensitive
  #               inputs that can alter the packaged release manifest?
  # Non-PR events report promotion=false and sensitive=true so push/dispatch
  # runs always take the full release-verification path. Seconds of runtime;
  # never builds anything.
  change-scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      promotion: ${{ steps.scope.outputs.promotion }}
      sensitive: ${{ steps.scope.outputs.sensitive }}
    steps:
      # Full history so the base...head diff below is computed from the real
      # PR base SHA, not a shallow guess.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: scope
        # Branch names and SHAs enter ONLY via env (never interpolated into
        # the script text), so an attacker-controlled branch name cannot
        # inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          promotion=false
          sensitive=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if { [ "$HEAD_REF" = "dev" ] && [ "$BASE_REF" = "stage" ]; } || \
               { [ "$HEAD_REF" = "stage" ] && [ "$BASE_REF" = "main" ]; }; then
              promotion=true
            fi
            # Changed files anchored to the PR base SHA (three-dot semantics
            # via merge-base) — reliable even when base has advanced.
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            sensitive=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                android/*|pubspec.yaml|pubspec.lock|scripts/check_android_release_permissions.sh|scripts/fetch_bundletool.sh|.github/workflows/flutter-ci.yml)
                  sensitive=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi
          {
            echo "promotion=$promotion"
            echo "sensitive=$sensitive"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Change-scope classification"
            echo "- event: \`$EVENT_NAME\` (head \`${HEAD_REF:-n/a}\` -> base \`${BASE_REF:-n/a}\`)"
            echo "- standard promotion PR: \`$promotion\`"
            echo "- permission/native/dependency-sensitive: \`$sensitive\`"
            if [ "$promotion" = "true" ]; then
              echo "- heavy CI skipped: the promoted commits already passed full PR CI into the head branch, and the destination-branch push run re-verifies the release build on the merged commit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  analyze-and-test:
    name: Format, Analyze & Test
    needs: change-scope
    # Skipped only for a standard dev->stage / stage->main promotion PR (see
    # the tiered policy in the header). A skipped run reports conclusion
    # "skipped", which branch protection accepts for a required check.
    if: github.event_name != 'pull_request' || needs.change-scope.outputs.promotion != 'true'
    runs-on: ubuntu-latest

    steps:
      # Free runner disk space before the toolchain and builds. Runs 429/430
      # (the first to include the release smoke build) failed with "No space
      # left on device" in :app:mergeReleaseNativeDebugMetadata — the default
      # ubuntu-latest image leaves ~14 GB free, which the debug + R8 release
      # builds together exhaust. Removing preinstalled toolchains this job
      # never uses (.NET, Haskell, CodeQL, Boost, Swift) frees ~15 GB. The
      # Android SDK and JDK are NOT touched.
      - name: Free runner disk space
        run: |
          echo "Free space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift
          echo "Free space after cleanup:"
          df -h /

      - uses: actions/checkout@v4

      # JDK 17 for the Android Gradle build below. The GitHub-hosted Android SDK
      # (preinstalled on ubuntu-latest) is used as-is; no SDK download, no
      # signing config, and no secrets are introduced.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Guard the native Android/iOS notification configuration (scheduled-
      # notification receivers, reboot permission, notification delegate,
      # dedicated icon, release shrinking config). Runs before the Flutter build
      # so a platform-config regression fails fast. Standard-library Python only.
      - name: Check notification platform config
        run: |
          python3 .github/scripts/check_notification_platform_config.py selftest
          python3 .github/scripts/check_notification_platform_config.py check

      # Keep the release tooling honest on every change: the selftests prove the
      # release gates still fail for a broken configuration, and the
      # repository-only checks catch app-identity/version-drift regressions (a
      # hardcoded versionName, a changed bundle id, missing release notes) at PR
      # time rather than when a release is being cut.
      #
      # This is the REPOSITORY CORRECTNESS level only. It deliberately does not
      # pass --require-secrets or --require-store-readiness: normal CI has no
      # signing secrets, and a green PR is not release approval or store
      # readiness. The signed release workflows apply those levels.
      - name: Release preflight (repository checks)
        run: |
          scripts/release_preflight.sh selftest
          scripts/generate_release_manifest.sh selftest
          scripts/verify_release_ref.sh selftest
          scripts/release_preflight.sh check

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
        env:
          TZ: Australia/Perth

      # Ephemeral CI-only signing key so the release smoke build below can
      # produce a signed APK without touching production signing secrets.
      # Generated fresh in $RUNNER_TEMP (job-scoped, never cached, never
      # uploaded as an artifact, and unrelated to android/key.properties or
      # any repository/organization secret).
      #
      # Gated to stage/main merges (push) or a manual dispatch targeting one
      # of them — not run on dev pushes or any pull_request — per the
      # release-build-scope note at the top of this file.
      - name: Generate temporary CI keystore
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calee-ci-release.jks" \
            -storepass "ci-temporary-password" \
            -keypass "ci-temporary-password" \
            -alias "calee-ci" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Calee CI, OU=CI, O=Calee, L=Perth, ST=WA, C=AU"

      # Smoke-verify that the isMinifyEnabled/isShrinkResources release config
      # still produces a working, correctly packaged release build (R8 +
      # resource shrinking exercise real code paths a debug build does not).
      # Signed with the ephemeral keystore above; this APK is a smoke-test
      # product only — never uploaded, never published.
      #
      # Gated to stage/main merges (push) or a manual dispatch targeting one
      # of them — see the release-build-scope note at the top of this file.
      - name: Build Android APK (release)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calee-ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-temporary-password
          ANDROID_KEY_ALIAS: calee-ci
          ANDROID_KEY_PASSWORD: ci-temporary-password

      # Inspect the packaged release artifact itself — manifest permissions,
      # the scheduled-notification receivers, and the notification icon must
      # all survive R8 + resource shrinking. The source-level config check
      # above can't catch a shrinker regression; this reads the built APK.
      # Standard-library Python only; never modifies the APK.
      #
      # Gated identically to the release build above (it inspects that
      # build's output, so it must skip whenever that step skips) — see the
      # release-build-scope note at the top of this file.
      - name: Inspect release APK notification configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          python3 .github/scripts/check_notification_release_apk.py selftest
          python3 .github/scripts/check_notification_release_apk.py check \
            build/app/outputs/flutter-apk/app-release.apk

      # Same gating as the release smoke build above: verify the packaged
      # release APK carries no broad storage/media permission (the Google
      # Play 0.0.29 release blocker). Shares the single prohibited-permission
      # policy in scripts/check_android_release_permissions.sh with the PR
      # AAB gate below and the signed-build workflow.
      - name: Inspect release APK permissions
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --apk build/app/outputs/flutter-apk/app-release.apk

  # Required, non-publishing platform-build gate: compiles the Android app so
  # a change that builds green in analyze/test but breaks the platform build
  # (a manifest-merge conflict, a plugin's minSdk requirement, a Gradle/Kotlin
  # incompatibility) is caught on every PR, not only at stage/main promotion.
  # Debug only: uses the Flutter/Gradle auto-generated debug keystore, no
  # repository or organization signing secret; produces no artifact that is
  # uploaded, published, or deployed anywhere.
  # Tiered execution (see header): on a development/hotfix PR this job builds
  # the debug APK always and the release-AAB permission gate only when the
  # change-scope job classified the change as permission/native/dependency-
  # sensitive; on a stage/main push it skips the debug APK (the same run's
  # release APK + AAB verification covers the commit) and keeps the AAB
  # permission gate; on a standard promotion PR the whole job is skipped.
  # The job/check name is unchanged.
  android-debug-build:
    name: Android debug build
    needs: change-scope
    if: github.event_name != 'pull_request' || needs.change-scope.outputs.promotion != 'true'
    runs-on: ubuntu-latest

    steps:
      # Same rationale as the equivalent step in analyze-and-test above: the
      # default ubuntu-latest image doesn't reliably leave enough free space
      # for a Gradle + Android build alongside preinstalled toolchains this
      # job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      # Bounds build duration on repeat runs (a cold Gradle/AGP/Kotlin +
      # dependency resolution is the dominant cost of this job). Cache-only:
      # never affects build output or signing.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      # Skipped on stage/main pushes: those runs verify the release APK and
      # release AAB on the same commit, so a debug APK adds no signal there.
      # `push` only triggers this workflow for stage/main, so event-name alone
      # is the exact gate. Still runs on every development/hotfix PR and on
      # manual dispatch.
      - name: Build Android APK (debug)
        if: github.event_name != 'push'
        run: flutter build apk --debug

      # --- Broad-media-permission regression gate (runs on every PR) --------
      # Google Play rejected the 0.0.29 AAB because a plugin's library
      # manifest merged READ_MEDIA_IMAGES/READ_MEDIA_VIDEO (and friends) into
      # the release artifact. The app manifest now strips them with
      # tools:node="remove"; the steps below rebuild the actual release AAB —
      # the artifact type Google Play receives — and fail the PR if any
      # prohibited permission ever merges back in (e.g. via a dependency
      # bump). Policy list lives in
      # scripts/check_android_release_permissions.sh, shared with the
      # signed-build workflow so the two gates can never drift apart.

      # Release Gradle builds hard-require signing inputs, so use the same
      # ephemeral CI-only keystore pattern as the stage/main release smoke
      # build in the job above: generated fresh in $RUNNER_TEMP, never cached,
      # never uploaded, unrelated to any production signing secret.
      #
      # This and the three steps below (the release-AAB permission gate) run
      # on every push/dispatch, but on a pull request only when the change
      # touched permission/native/dependency-sensitive inputs (see the
      # change-scope job). A Dart-only change cannot alter the packaged
      # manifest, so the ~10-minute release bundle build proves nothing for
      # it. The prohibited-permission POLICY itself
      # (scripts/check_android_release_permissions.sh) is unchanged and still
      # enforced on every sensitive PR, every stage/main push, and the signed
      # release workflow.
      - name: Generate temporary CI keystore
        if: github.event_name != 'pull_request' || needs.change-scope.outputs.sensitive == 'true'
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calee-ci-release.jks" \
            -storepass "ci-temporary-password" \
            -keypass "ci-temporary-password" \
            -alias "calee-ci" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Calee CI, OU=CI, O=Calee, L=Perth, ST=WA, C=AU"

      # This AAB is a permission-inspection product only — never uploaded as
      # an artifact, never published.
      - name: Build Android App Bundle (release)
        if: github.event_name != 'pull_request' || needs.change-scope.outputs.sensitive == 'true'
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calee-ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-temporary-password
          ANDROID_KEY_ALIAS: calee-ci
          ANDROID_KEY_PASSWORD: ci-temporary-password

      # bundletool decodes the AAB's compiled manifest for the check below.
      # Pinned version + checksum verification live in
      # scripts/fetch_bundletool.sh; the cache only saves the re-download and
      # the jar is checksum-verified again on every run before use.
      - name: Cache bundletool
        if: github.event_name != 'pull_request' || needs.change-scope.outputs.sensitive == 'true'
        uses: actions/cache@v4
        with:
          path: build/bundletool
          key: bundletool-1.18.1

      - name: Inspect release AAB permissions
        if: github.event_name != 'pull_request' || needs.change-scope.outputs.sensitive == 'true'
        run: |
          BUNDLETOOL_JAR="$(scripts/fetch_bundletool.sh)"
          export BUNDLETOOL_JAR
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --aab build/app/outputs/bundle/release/app-release.aab
