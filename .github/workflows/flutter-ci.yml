name: Flutter CI

# Runs the required format/analyze/test gate for every change headed for an
# integration branch. `dev` is the day-to-day integration branch, so every
# normal CaleeMobile pull request (which targets `dev`) now receives this same
# check; `stage` and `main` keep it for the promotion path.
#
# Branch-protection note for administrators: the required status checks to
# enforce on `dev` (and `stage`/`main`) are the two job names below,
#   "Format, Analyze & Test"
#   "Android debug build"
# reported under this "Flutter CI" workflow. Add both under
# Settings -> Branches -> Branch protection rules -> Require status checks to
# pass before merging, for each of `dev`, `stage`, and `main`, so no pull
# request can merge into an integration branch without a green run of each.
#
# Release-build scope: both required jobs run on every trigger below. The
# release-APK build/sign/notification-config steps near the bottom of the
# "Format, Analyze & Test" job are gated to only execute on a push to `stage`
# or `main` (i.e. a merge/promotion into those branches) or a manual
# workflow_dispatch targeting one of them — never on a `dev` push or on any
# pull_request, including PRs targeting stage/main. See the `if:` conditions
# on those individual steps for the exact rule. The debug Android build in
# the separate job below is not gated this way: it runs on every pull
# request, so a platform build broken by a change that still passes
# format/analyze/test is caught before merge, not only at stage/main
# promotion.
on:
  pull_request:
    branches:
      - dev
      - stage
      - main
  # Pull requests already validate every change headed for dev. Do not repeat
  # the full gate after the same change merges there. Push runs remain on the
  # release branches because they execute the gated release smoke checks below.
  push:
    branches:
      - stage
      - main
  # Allow the gate to be started on demand from the Actions tab (any branch).
  workflow_dispatch:

# A new commit on an open PR makes its older in-flight run obsolete. Keep every
# stage/main push and manual run, because release verification must complete.
concurrency:
  group: flutter-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      # Free runner disk space before the toolchain and builds. Runs 429/430
      # (the first to include the release smoke build) failed with "No space
      # left on device" in :app:mergeReleaseNativeDebugMetadata — the default
      # ubuntu-latest image leaves ~14 GB free, which the debug + R8 release
      # builds together exhaust. Removing preinstalled toolchains this job
      # never uses (.NET, Haskell, CodeQL, Boost, Swift) frees ~15 GB. The
      # Android SDK and JDK are NOT touched.
      - name: Free runner disk space
        run: |
          echo "Free space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift
          echo "Free space after cleanup:"
          df -h /

      - uses: actions/checkout@v4

      # JDK 17 for the Android Gradle build below. The GitHub-hosted Android SDK
      # (preinstalled on ubuntu-latest) is used as-is; no SDK download, no
      # signing config, and no secrets are introduced.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Guard the native Android/iOS notification configuration (scheduled-
      # notification receivers, reboot permission, notification delegate,
      # dedicated icon, release shrinking config). Runs before the Flutter build
      # so a platform-config regression fails fast. Standard-library Python only.
      - name: Check notification platform config
        run: |
          python3 .github/scripts/check_notification_platform_config.py selftest
          python3 .github/scripts/check_notification_platform_config.py check

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
        env:
          TZ: Australia/Perth

      # Ephemeral CI-only signing key so the release smoke build below can
      # produce a signed APK without touching production signing secrets.
      # Generated fresh in $RUNNER_TEMP (job-scoped, never cached, never
      # uploaded as an artifact, and unrelated to android/key.properties or
      # any repository/organization secret).
      #
      # Gated to stage/main merges (push) or a manual dispatch targeting one
      # of them — not run on dev pushes or any pull_request — per the
      # release-build-scope note at the top of this file.
      - name: Generate temporary CI keystore
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calee-ci-release.jks" \
            -storepass "ci-temporary-password" \
            -keypass "ci-temporary-password" \
            -alias "calee-ci" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Calee CI, OU=CI, O=Calee, L=Perth, ST=WA, C=AU"

      # Smoke-verify that the isMinifyEnabled/isShrinkResources release config
      # still produces a working, correctly packaged release build (R8 +
      # resource shrinking exercise real code paths a debug build does not).
      # Signed with the ephemeral keystore above; this APK is a smoke-test
      # product only — never uploaded, never published.
      #
      # Gated to stage/main merges (push) or a manual dispatch targeting one
      # of them — see the release-build-scope note at the top of this file.
      - name: Build Android APK (release)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calee-ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-temporary-password
          ANDROID_KEY_ALIAS: calee-ci
          ANDROID_KEY_PASSWORD: ci-temporary-password

      # Inspect the packaged release artifact itself — manifest permissions,
      # the scheduled-notification receivers, and the notification icon must
      # all survive R8 + resource shrinking. The source-level config check
      # above can't catch a shrinker regression; this reads the built APK.
      # Standard-library Python only; never modifies the APK.
      #
      # Gated identically to the release build above (it inspects that
      # build's output, so it must skip whenever that step skips) — see the
      # release-build-scope note at the top of this file.
      - name: Inspect release APK notification configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          python3 .github/scripts/check_notification_release_apk.py selftest
          python3 .github/scripts/check_notification_release_apk.py check \
            build/app/outputs/flutter-apk/app-release.apk

      # Same gating as the release smoke build above: verify the packaged
      # release APK carries no broad storage/media permission (the Google
      # Play 0.0.29 release blocker). Shares the single prohibited-permission
      # policy in scripts/check_android_release_permissions.sh with the PR
      # AAB gate below and the signed-build workflow.
      - name: Inspect release APK permissions
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["stage","main"]'), github.ref_name)
        run: |
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --apk build/app/outputs/flutter-apk/app-release.apk

  # Required, non-publishing platform-build gate: compiles the Android app so
  # a change that builds green in analyze/test but breaks the platform build
  # (a manifest-merge conflict, a plugin's minSdk requirement, a Gradle/Kotlin
  # incompatibility) is caught on every PR, not only at stage/main promotion.
  # Debug only: uses the Flutter/Gradle auto-generated debug keystore, no
  # repository or organization signing secret; produces no artifact that is
  # uploaded, published, or deployed anywhere.
  android-debug-build:
    name: Android debug build
    runs-on: ubuntu-latest

    steps:
      # Same rationale as the equivalent step in analyze-and-test above: the
      # default ubuntu-latest image doesn't reliably leave enough free space
      # for a Gradle + Android build alongside preinstalled toolchains this
      # job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      # Bounds build duration on repeat runs (a cold Gradle/AGP/Kotlin +
      # dependency resolution is the dominant cost of this job). Cache-only:
      # never affects build output or signing.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      # --- Broad-media-permission regression gate (runs on every PR) --------
      # Google Play rejected the 0.0.29 AAB because a plugin's library
      # manifest merged READ_MEDIA_IMAGES/READ_MEDIA_VIDEO (and friends) into
      # the release artifact. The app manifest now strips them with
      # tools:node="remove"; the steps below rebuild the actual release AAB —
      # the artifact type Google Play receives — and fail the PR if any
      # prohibited permission ever merges back in (e.g. via a dependency
      # bump). Policy list lives in
      # scripts/check_android_release_permissions.sh, shared with the
      # signed-build workflow so the two gates can never drift apart.

      # Release Gradle builds hard-require signing inputs, so use the same
      # ephemeral CI-only keystore pattern as the stage/main release smoke
      # build in the job above: generated fresh in $RUNNER_TEMP, never cached,
      # never uploaded, unrelated to any production signing secret.
      - name: Generate temporary CI keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calee-ci-release.jks" \
            -storepass "ci-temporary-password" \
            -keypass "ci-temporary-password" \
            -alias "calee-ci" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Calee CI, OU=CI, O=Calee, L=Perth, ST=WA, C=AU"

      # This AAB is a permission-inspection product only — never uploaded as
      # an artifact, never published.
      - name: Build Android App Bundle (release)
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calee-ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-temporary-password
          ANDROID_KEY_ALIAS: calee-ci
          ANDROID_KEY_PASSWORD: ci-temporary-password

      # bundletool decodes the AAB's compiled manifest for the check below.
      # Pinned version + checksum verification live in
      # scripts/fetch_bundletool.sh; the cache only saves the re-download and
      # the jar is checksum-verified again on every run before use.
      - name: Cache bundletool
        uses: actions/cache@v4
        with:
          path: build/bundletool
          key: bundletool-1.18.1

      - name: Inspect release AAB permissions
        run: |
          BUNDLETOOL_JAR="$(scripts/fetch_bundletool.sh)"
          export BUNDLETOOL_JAR
          scripts/check_android_release_permissions.sh selftest
          scripts/check_android_release_permissions.sh check \
            --aab build/app/outputs/bundle/release/app-release.aab
