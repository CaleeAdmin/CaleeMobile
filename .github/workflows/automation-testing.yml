name: Automation Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-instrumentation:
    name: Run instrumentation tests on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components (compileSdk 34 + build-tools + platform-tools + NDK)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Run connectedDebugAndroidTest (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail

            # Ensure local.properties exists (required by android/settings.gradle.kts)
            SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [ -z "$SDK_DIR" ]; then
              echo "ERROR: ANDROID_SDK_ROOT/ANDROID_HOME not set"
              exit 1
            fi

            cat > android/local.properties <<EOF
            flutter.sdk=$FLUTTER_ROOT
            sdk.dir=$SDK_DIR
            EOF

            # Extra boot readiness guard (reduces flakiness)
            adb wait-for-device

            cd android
            chmod +x ./gradlew
            ./gradlew connectedDebugAndroidTest --stacktrace
