name: Automation Testing

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  flutter-tests:
    name: Flutter unit + integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests (unit + sqlite integration)
        run: flutter test

  android-instrumentation:
    name: Android instrumentation (WorkManager/worker/receiver)
    runs-on: ubuntu-latest
    needs: flutter-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest --stacktrace
